[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "critshowcase"
version = "0.2.0"
description = "CRITShowCase（B50 影片）的出片工具：讀 critlog.me 匯出的影片專案，合成 mp4"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["yt-dlp[default]"]

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.10"]
build = ["pyinstaller>=6"]

[project.scripts]
critshowcase = "critshowcase.cli:main"

[project.gui-scripts]
critshowcase-gui = "critshowcase.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"critshowcase.gui" = ["assets/*.png"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
