# Windows 免安裝版：建置、在乾淨環境做煙霧測試；推 v* tag 時附到 GitHub Release。
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      youtube:
        description: 也測試實際下載 YouTube 片段（網路或 YouTube 可能讓它失敗）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install -e ".[build]"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "from importlib.metadata import version; print(version('critshowcase'))")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME 跟 pyproject.toml 的版本 $version 不符"
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: build/downloads
          key: tools-${{ hashFiles('packaging/build.py') }}

      - name: Build
        run: python packaging/build.py

      - name: Smoke test
        run: python packaging/smoke.py dist/critshowcase ${{ inputs.youtube && '--youtube' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: critshowcase-windows-x64
          path: dist/critshowcase-*-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/critshowcase-*-windows-x64.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/critshowcase-*-windows-x64.zip --generate-notes
          fi
